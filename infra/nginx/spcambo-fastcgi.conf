include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTP_X_REQUEST_ID $request_id;
# The edge sanitizes these headers before Laravel trusts this Nginx peer.
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $edge_forwarded_proto;
fastcgi_param HTTP_X_FORWARDED_PORT $edge_forwarded_port;
fastcgi_pass laravel;
fastcgi_read_timeout 60s;
