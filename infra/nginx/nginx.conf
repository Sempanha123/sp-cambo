user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_header_timeout 10s;
    client_body_timeout 30s;
    log_format safe '$remote_addr - $request_id [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log safe;

    # The Compose edge is bound to host loopback. Only the deployment-controlled
    # TLS proxy may supply client forwarding data; direct public access is forbidden.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.29.0.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $http_x_forwarded_proto $edge_forwarded_proto { https https; default $scheme; }
    map $edge_forwarded_proto $edge_forwarded_port { https 443; default 80; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream frontend { server frontend:3000; keepalive 16; }
    upstream laravel { server backend:9000; }
    upstream gateway { server gateway:3010; keepalive 64; }
    upstream reverb { server reverb:8080; }

    # Internal control-plane listener. Port 8081 is not published by Compose.
    server {
        listen 8081;
        server_name _;
        client_max_body_size 1m;
        location ^~ /api/v1/internal/gateway/ { include /etc/nginx/spcambo-fastcgi.conf; }
        location / { return 404; }
    }

    # Public inference/control-plane API domain. TLS terminates at the host/load balancer.
    server {
        listen 80 default_server;
        server_name api.spcambo.com;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location ^~ /api/v1/internal/ { return 404; }
        location ^~ /api/v1/ { include /etc/nginx/spcambo-fastcgi.conf; }
        location = /sanctum/csrf-cookie { include /etc/nginx/spcambo-fastcgi.conf; }

        location ^~ /v1/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
            proxy_pass http://gateway;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            gzip off;
        }

        location ^~ /app/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_pass http://reverb;
        }

        location / { return 404; }
    }

    # Public product UI domain.
    server {
        listen 80;
        server_name app.spcambo.com www.spcambo.com;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://frontend;
        }
    }
}
